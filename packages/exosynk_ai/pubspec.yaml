name: exosynk_ai
description: >-
  Exo, the one assistant across ExoSynk Labs apps: its identity, what it
  knows about ExoSynk Labs and its apps, and the rules every app's Exo
  follows. Pure Dart — no Flutter, no network. Each app adds only its own
  part (what it does, its data); everything shared lives here.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

