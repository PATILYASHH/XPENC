name: xpenc_local_ai
description: >-
  On-device AI for XPENC: llama.cpp (chat) and whisper.cpp (speech to text),
  built from the pinned sources in src/third_party. Nothing is downloaded or
  prebuilt; the models are files the user imports.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
