name: iOS build

# Compiles XPENC for iOS on a macOS runner and packages an unsigned IPA —
# proof the app still builds for iOS, and the file AltStore / SideStore
# re-sign with each user's own Apple ID on their device. Nothing here signs
# or publishes anything; the IPA is only a workflow artifact.

on:
  push:
    branches: [ios, BETA]
    paths-ignore:
      - "website/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build ios --release --no-codesign

      # An .ipa is just Payload/Runner.app, zipped.
      - name: Package IPA
        run: |
          VERSION="$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "XPENC-${VERSION}-unsigned.ipa" Payload
          ls -lh ./*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: xpenc-ios-unsigned
          path: build/ipa/*.ipa
          retention-days: 14
