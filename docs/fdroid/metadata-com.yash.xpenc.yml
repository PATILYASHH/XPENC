# Reference copy of the fdroiddata recipe for XPENC — the live version is in
# the fdroiddata MR (gitlab.com/fdroid/fdroiddata, metadata/com.yash.xpenc.yml).
# Kept here so the repo documents its own F-Droid packaging. Pulled back into
# sync with the live GitLab file on 2026-08-19 — it had drifted to 1.1.2 while
# GitLab was already at 1.4.0 (all disabled). Re-verify with `fdroid lint` +
# `fdroid rewritemeta` before submitting.
#
# Live status as of 2026-08-19: F-Droid users are stuck on 1.2.1/versionCode 73
# because every 1.3.0 and 1.4.0 build entry upstream carries
# `disable: https://github.com/PATILYASHH/XPENC/issues/49` — a real database
# migration crash on upgrade from 1.2.1, fixed in v1.4.1. Nobody's told
# fdroiddata about the fix since; this file adds the first buildable entry
# past 1.2.1 to unblock it. The 1.3.0/1.4.0 disables are left in place on
# purpose — those builds are genuinely broken, don't re-enable them.
#
# IMPORTANT — targets v1.4.1, NOT v1.4.2: v1.4.2 (commit 4e0aa46) still
# depends on google_mlkit_commons/google_mlkit_text_recognition (added for
# screenshot-OCR intake), which is both non-FLOSS (the original reason F-Droid
# review flagged #57) and fails to even Gradle-configure in F-Droid's sandbox
# build environment (NullPointerException evaluating :google_mlkit_commons —
# confirmed via an actual failed F-Droid build log on 2026-08-19). The switch
# to Tesseract (flutter_tesseract_ocr, BSD-3, offline traineddata) that
# removes ML Kit exists ONLY as uncommitted local changes as of this writing
# — it has never been committed or released. v1.4.1 predates ML Kit entirely
# (added after 1.4.1, before 1.4.2) and already carries the #49 migration
# fix, making it the cleanest buildable target until the Tesseract switch is
# actually committed and shipped in a real release.
#
# versionCode scheme (F-Droid standard for Flutter, set in build.gradle.kts):
#   base versionCode * 10 + ABI  (armeabi-v7a=1, arm64-v8a=2, x86_64=3).
#   1.1.2+4 -> 41 / 42 / 43, verified with aapt. Encoded in VercodeOperation.
# commit: uses the full hash (not a tag) per F-Droid review.
# Flutter version is extracted (digit-anchored sed) from release.yml at build
# time. No `rm:` — the project is Android-only (no ios/linux/macos/web/windows).

